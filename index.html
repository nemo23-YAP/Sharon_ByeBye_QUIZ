<style>
:root{
  --bg:#f7f3ee; --card:#fffdf9; --ink:#26221f; --muted:#7b726b;

*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#fff8f3 0,#f7f3ee 48%,#eee7e0 100%);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;color:var(--ink);min-height:100vh}
.app{width:min(760px,100%);margin:0 auto;padding:28px 18px 42px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-weight:800;letter-spacing:.02em}
.progress{font-size:14px;color:var(--muted)}
.progressbar{height:7px;background:#eadfd7;border-radius:99px;overflow:hidden;margin-bottom:24px}
.progressbar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s}
.card{background:rgba(255,253,249,.94);border:1px solid var(--border);border-radius:28px;padding:28px;box-shadow:0 18px 50px rgba(71,51,38,.08)}
.kicker{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.08em;margin-bottom:10px}
h1{font-size:clamp(25px,5vw,36px);line-height:1.25;margin:0 0 26px}
.question-photo{margin:0 auto 22px;border-radius:18px;overflow:hidden;border:1px solid var(--border);background:#111;max-width:560px}.question-photo img{display:block;width:100%;height:auto;max-height:620px;object-fit:contain}.option{width:100%;text-align:left;border:1.5px solid var(--border);background:#fff;border-radius:18px;padding:16px 18px;margin:10px 0;font-size:16px;line-height:1.55;cursor:pointer;transition:.18s}
.option:hover{border-color:#cdbeb3;transform:translateY(-1px)}
.option:focus-visible{outline:3px solid #ffc3b4;outline-offset:2px}
.option.selected{border-color:var(--accent);background:var(--accent2)}
.option.correct{border-color:var(--good);background:var(--goodbg)}
.option.wrong{border-color:var(--bad);background:var(--badbg)}
.badge{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;border-radius:50%;background:#f1e9e3;margin-right:10px;font-weight:800}
.option.correct .badge{background:#bfe9d4;color:#176b49}.option.wrong .badge{background:#ffd0d0;color:#9c2e2e}
.feedback{margin-top:20px;border-radius:18px;padding:18px 20px;background:#f6f1ec;border:1px solid var(--border)}
.feedback strong{display:block;margin-bottom:7px}
.feedback.good{background:var(--goodbg);border-color:#bfe9d4}.feedback.bad{background:var(--badbg);border-color:#ffd0d0}
.actions{display:flex;gap:10px;margin-top:18px}
button.action{border:0;border-radius:16px;padding:14px 20px;font-size:16px;font-weight:800;cursor:pointer}
.primary{background:var(--ink);color:#fff;flex:1}.primary:disabled{opacity:.35;cursor:not-allowed}
.secondary{background:#eee7e0;color:var(--ink)}
.start,.result{text-align:center;padding:36px 20px}
.emoji{font-size:46px;margin-bottom:12px}.start h1,.result h1{margin-bottom:12px}
.sub{color:var(--muted);line-height:1.7;margin:0 auto 26px;max-width:540px}
.bigscore{font-size:64px;font-weight:900;line-height:1;margin:18px 0 8px}
.rate{font-size:18px;color:var(--muted)}
.result-actions{display:flex;gap:10px;margin-top:28px}
.note{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6}
@media(max-width:520px){.app{padding:18px 12px 30px}.card{padding:21px;border-radius:22px}h1{font-size:25px}.option{padding:14px}.actions{flex-direction:column}.result-actions{flex-direction:column}}

html{background:var(--bg)}
body{overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}

.question-photo{width:100%;max-width:100%;margin:0 auto 18px;border-radius:14px}

.start,.result{padding:30px 18px}

@media(min-width:600px){
  .app{padding:28px 18px 42px}
  .card{padding:28px;border-radius:28px}
  h1{font-size:clamp(25px,5vw,36px)}
  .option{padding:16px 18px}

}

const app = document.getElementById("app");
let state = {page:"start", index:0, selected:null, answered:false, score:0};

function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
}
function render(){
  if(state.page==="start") return renderStart();
  if(state.page==="result") return renderResult();
  renderQuestion();
}
function renderStart(){
  app.innerHTML = `
    <section class="card start">
      <div class="emoji">🧠</div>
      <div class="kicker">BYE BYE · MEMORY QUIZ</div>
      <h1>你真的記得我們多少事？</h1>
      <p class="sub">25 題、單選。每題作答後會立即公布對錯與解析，最後看看你的記憶力到底有多離譜。</p>
      <button class="action primary" id="startBtn">開始測驗</button>
    </section>`;
  document.getElementById("startBtn").onclick=()=>{
    state={page:"quiz",index:0,selected:null,answered:false,score:0};
    render();
  };
}
function renderQuestion(){
  const q=QUESTIONS[state.index], total=QUESTIONS.length, pct=((state.index)/total)*100;
  const photo = q.id===23 ? Q23_IMAGE : (q.id===24 ? Q24_IMAGE : (q.id===25 ? Q25_IMAGE : ""));
  app.innerHTML = `
    <div class="top"><div class="brand">BYE BYE QUIZ</div><div class="progress">${state.index+1} / ${total}</div></div>
    <div class="progressbar"><span style="width:${pct}%"></span></div>
    <section class="card">
      <div class="kicker">QUESTION ${String(q.id).padStart(2,"0")}</div>
      <h1>${esc(q.q).replace(/\n/g,"<br>")}</h1>
      ${photo ? `<div class="question-photo"><img src="${photo}" alt="第 ${q.id} 題圖片"></div>` : ""}
      <div id="options">
        ${q.options.map(o=>`
          <button class="option ${state.answered && o.id===q.answer?"correct":""} ${state.answered && state.selected===o.id && o.id!==q.answer?"wrong":""} ${!state.answered && state.selected===o.id?"selected":""}" data-id="${o.id}" ${state.answered?"disabled":""}>
            <span class="badge">${o.id}</span>${esc(o.text)}
          </button>`).join("")}
      </div>
      ${state.answered ? `
        <div class="feedback ${state.selected===q.answer?"good":"bad"}">
          <strong>${state.selected===q.answer?"✓ 答對了！":"✕ 答錯了！"}</strong>
          ${esc(q.options.find(o=>o.id===state.selected)?.fb || "")}
        </div>
        <div class="actions">
          <button class="action primary" id="nextBtn">${state.index===total-1?"查看結果":"下一題 →"}</button>
        </div>` : `
        <div class="actions"><button class="action primary" id="confirmBtn" disabled>確認答案</button></div>`}
    </section>`;
  document.querySelectorAll(".option").forEach(btn=>{
    btn.onclick=()=>{
      if(state.answered)return;
      state.selected=btn.dataset.id;
      document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));
      btn.classList.add("selected");
      document.getElementById("confirmBtn").disabled=false;
    };
  });
  const confirm=document.getElementById("confirmBtn");
  if(confirm) confirm.onclick=()=>{
    state.answered=true;
    if(state.selected===q.answer)state.score++;
    render();
  };
  const next=document.getElementById("nextBtn");
  if(next) next.onclick=()=>{
    if(state.index===total-1){
      state.page="result";
    }else{
      state.index++;
      state.selected=null;
      state.answered=false;
    }
    render();
  };
}
function renderResult(){
  const total=QUESTIONS.length, pct=Math.round(state.score/total*100);
  let title =
    state.score===25 ? "👑 你是不是偷看答案？" :
    state.score>=22 ? "🧠 記憶力大大進步了!!" :
    state.score>=18 ? "💕 這份友情有被你放在心上" :
    state.score>=14 ? "❤️‍🩹 我們的心要碎了" :
    state.score>=10 ? "🤨 我們真的有這麼不熟嗎？" :
    "🥲 友誼的小船終究要翻了？";
  app.innerHTML=`
    <section class="card result">
      <div class="emoji">${
        state.score===25 ? "👑" :
        state.score>=22 ? "🧠" :
        state.score>=18 ? "💕" :
        state.score>=14 ? "❤️‍🩹" :
        state.score>=10 ? "🤨" : "🥲"
      }</div>
      <div class="kicker">QUIZ COMPLETE</div>
      <h1>${title}</h1>
      <div class="bigscore">${state.score} / ${total}</div>
      <div class="rate">答對率 ${pct}%</div>
      <div class="result-actions">
        <button class="action primary" id="againBtn">再玩一次</button>
      </div>
      <div class="note">每次重新開始都會從第 1 題重新挑戰。</div>
    </section>`;
  document.getElementById("againBtn").onclick=()=>{
    state={page:"quiz",index:0,selected:null,answered:false,score:0};
    render();
  };
}
render();
</script>
</body>
